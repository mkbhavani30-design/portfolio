<h2>Contact me</h2>
<p style="margin-bottom:24px;color:var(--muted)">Email <a href="mailto:bhavani@gmail.com">bhavani@gmail.com</a> or use the form. Not sure yet? Check my <a href="projects.html">projects</a> or <a href="about.html">background</a> first.</p>
<form id="contact-form" novalidate>
<label>Name<input id="name" name="name" autocomplete="name"><span class="err" data-for="name"></span></label>
<label>Email<input id="email" name="email" type="email" autocomplete="email"><span class="err" data-for="email"></span></label>
<label>Message<textarea id="message" name="message" rows="5"></textarea><span class="err" data-for="message"></span></label>
<button class="btn" type="submit">Send message</button>
<p id="status" role="status"></p>
